<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animal Communication Indonesia</title>
<meta name="description" content="Layanan animal communicator: sesi komunikasi, spirit, hewan hilang, dan pelatihan.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4f5f7;--fg:#2b2e33;--card:#fff;--mut:#6d737c;--line:#e3e6ea;--accent:#2f7d6b;--soft:#e8f0ee}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--bf,Inter),system-ui,sans-serif;line-height:1.65}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.2;margin:0 0 .5em}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{background:var(--accent);color:#fff;font-size:.8rem;padding:5px 16px;text-align:center}
.nav{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;color:var(--fg);text-decoration:none;white-space:nowrap}
.links{display:flex;gap:2px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.links a{padding:6px 11px;border-radius:99px;color:var(--mut);text-decoration:none;font-size:.88rem;white-space:nowrap}.links a.on{background:var(--soft);color:var(--accent);font-weight:600}
main{max-width:1100px;margin:auto;padding:20px 16px 90px}section{margin-top:48px}
.hero{border-radius:28px;padding:32px 24px;min-height:min(82vh,640px);display:flex;flex-direction:column;justify-content:flex-end;background:var(--soft) center 45%/cover;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.hero.img{color:#fff}.hero h1{font-size:clamp(2rem,6vw,3.4rem);max-width:700px;text-shadow:0 2px 14px rgba(0,0,0,.45)}.hero p{max-width:560px;font-size:1.05rem;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.chip{align-self:flex-start;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4);color:#fff;padding:5px 14px;border-radius:99px;font-size:.82rem;margin-bottom:14px}
.stats{margin-top:-34px;position:relative;padding:0 12px}.stats .card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:color-mix(in srgb,var(--card) 90%,transparent)}
.card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.08)}
section>h2{display:inline-block;border-bottom:3px solid var(--accent);padding-bottom:4px}
@media(prefers-reduced-motion:no-preference){.hero{animation:up .6s both}}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 20px;font:600 .95rem inherit;cursor:pointer;text-decoration:none}
.btn.o{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}.btn.r{background:#c0443a}.btn.s{padding:6px 12px;font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.ic{font-size:2.2rem}
.cv{width:100%;height:170px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.pk{list-style:none;padding:0;margin:12px 0}.pk li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}.pk b{color:var(--accent);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;text-align:center}.stats b{font:700 2.2rem Fraunces,serif;color:var(--accent);display:block}
.steps{counter-reset:s}.steps .card::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;margin-bottom:8px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:24px;align-items:center}.split img{width:100%;border-radius:20px;box-shadow:0 14px 36px rgba(0,0,0,.15)}
#paws{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}#paws span{position:absolute;width:24px;height:24px;margin:-12px;background:var(--accent);-webkit-mask:var(--paw) center/contain no-repeat;mask:var(--paw) center/contain no-repeat;opacity:0;animation:pw 4.5s ease-out forwards}@keyframes pw{12%{opacity:.45}100%{opacity:0}}
.mq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:14px;width:max-content;animation:mv 45s linear infinite}.mq:hover .track{animation-play-state:paused}@keyframes mv{to{transform:translateX(-50%)}}
.t{width:min(300px,80vw);flex:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;white-space:normal}.t p{margin:0;font-size:.92rem}
.who{display:flex;gap:10px;align-items:center;margin-bottom:8px}.who img,.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center}
.gal{columns:2 170px;gap:10px}.gal img{width:100%;border-radius:14px;margin-bottom:10px;display:block;cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:50;padding:16px}#lb img{max-width:100%;max-height:100%;border-radius:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}
label{display:block;font-weight:500;font-size:.9rem;margin:12px 0 4px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}textarea{min-height:90px}input[type=color]{height:42px;padding:3px}
.fm{max-width:600px}.ok{background:var(--soft);color:var(--accent);padding:14px;border-radius:12px;margin-top:14px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:99px;padding:12px 18px;font-weight:600;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:25}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 14px;cursor:pointer;white-space:nowrap;font:inherit;font-size:.88rem}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.li img{width:44px;height:44px;border-radius:8px;object-fit:cover}
footer{background:var(--soft);padding:30px 16px;margin-top:40px}footer .in{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}footer a{color:var(--accent)}

/* ===== responsif & anti-tumpuk ===== */
html{-webkit-text-size-adjust:100%}body{overflow-x:clip}img{max-width:100%}
.top{padding:calc(5px + env(safe-area-inset-top,0px)) 12px 5px;font-size:.75rem;line-height:1.3}
.brand{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:clamp(.92rem,3.6vw,1.15rem)}
.nav{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
main{padding:20px max(16px,env(safe-area-inset-right)) 110px max(16px,env(safe-area-inset-left))}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;text-align:center}.btn.s{min-height:36px}
input,textarea,select{font-size:16px}.fm{width:100%}.li{flex-wrap:wrap}
.links{display:none}.cta{display:none;white-space:nowrap}
#mb{display:grid;place-items:center;margin-left:auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:1.2rem;cursor:pointer}
.mm{display:none;flex-direction:column;gap:2px;padding:8px max(16px,env(safe-area-inset-left)) 14px;border-top:1px solid var(--line);max-height:75vh;overflow:auto}.mm.open{display:flex}
.mm a:not(.btn){padding:12px 8px;color:var(--fg);text-decoration:none;border-radius:10px}.mm a.on{background:var(--soft);color:var(--accent);font-weight:600}.mm .btn{margin-top:8px}
.hero{padding:26px 18px;min-height:min(82vh,640px);min-height:min(82svh,640px)}
.hero .row{margin-top:6px}.hero .row .btn{flex:1 1 170px}
.stats{grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;padding:0}.stats b{font-size:clamp(1.5rem,6vw,2.2rem)}.stats .card{padding:14px 8px;font-size:.8rem;line-height:1.3}
.fab{display:flex;align-items:center;gap:8px;right:max(16px,env(safe-area-inset-right))}.fab i{font-style:normal;font-size:1.3rem}
footer{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.fab{opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .25s,transform .25s}.fab.show{opacity:1;pointer-events:auto;transform:none}
@media(max-width:599px){.fab span{display:none}.fab{width:56px;height:56px;padding:0;justify-content:center}section{margin-top:36px}}
@media(min-width:600px){.cta{display:inline-flex;margin-left:auto}#mb{margin-left:0}.hero{padding:40px 32px}.hero .row .btn{flex:0 0 auto}.stats .card{padding:20px 12px;font-size:.95rem}}
@media(min-width:1000px){.links{display:flex;margin-left:auto}.cta{margin-left:0}#mb{display:none}.mm,.mm.open{display:none}.hero{padding:48px 44px}}

/* ===== latar putih keabu-abuan soft ===== */
html{min-height:100%;background:linear-gradient(160deg,#fcfcfd 0%,#f0f2f5 40%,#e5e9ee 100%) no-repeat}
body{background:transparent;color:var(--fg)}
header,.top{box-shadow:0 1px 0 var(--line)}
.hero.img{color:var(--fg)}
.hp{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:20px 20px 22px;max-width:640px;box-shadow:0 10px 30px rgba(60,70,85,.12)}
.hp h1,.hp p{text-shadow:none;color:var(--fg)}.hp p{color:var(--mut)}.hp h1{margin-bottom:.35em}
.chip{background:var(--soft);color:var(--accent);border:1px solid var(--line);backdrop-filter:none}
.hero{box-shadow:0 18px 44px rgba(60,70,85,.16)}
footer{background:linear-gradient(180deg,rgba(255,255,255,0),#dfe4ea)}
.card{box-shadow:0 2px 10px rgba(60,70,85,.05)}
@media(max-width:599px){.hero{min-height:min(92vh,700px);min-height:min(92svh,700px);padding:18px 14px}.hp{padding:16px 16px 18px}.hp h1{font-size:1.65rem}.hp p{display:none}.hero .row{gap:8px;flex-wrap:nowrap}.hero .row .btn{flex:1 1 auto;padding:10px 8px;font-size:.86rem;white-space:nowrap}}

/* ===== muncul & timbul ke atas saat di-scroll ===== */
.rv{opacity:0;transform:translateY(42px) scale(.97);transition:opacity .75s cubic-bezier(.2,.7,.2,1),transform .75s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s);will-change:opacity,transform}
.rv.in{opacity:1;transform:none}
</style>

const waLink=t=>`https://wa.me/${waNum(D.cfg.wa)}?text=${encodeURIComponent(t||'Halo, saya ingin bertanya tentang layanan animal communication.')}`;
const api=b=>fetch(API,{method:'POST',body:JSON.stringify(b)}).then(r=>r.json());
const pic=(f,max=800)=>new Promise(r=>{if(!f)return r('');const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=fr.result};fr.readAsDataURL(f)});
const nid=a=>Math.max(0,...a.map(x=>x.id))+1;
const NAV=[['beranda','Beranda'],['tentang','Tentang'],['layanan','Layanan'],['pelatihan','Pelatihan'],['testimoni','Testimoni'],['galeri','Galeri'],['artikel','Artikel'],['kontak','Kontak']];

/* ---------- tampilan publik ---------- */
const pk=s=>`<ul class="pk">${String(s.pk||'').split('\n').filter(Boolean).map(l=>{const[a,b]=l.split('|');return `<li><span>${esc(a)}</span><b>${esc(b||'')}</b></li>`}).join('')}</ul>`;
const card=s=>`<div class="card">${s.img?`<img class="cv" src="${esc(s.img)}" alt="">`:`<div class="ic">${esc(s.icon)}</div>`}<h3>${esc(s.name)}</h3><p class="mut">${esc(s.desc)}</p>${pk(s)}<a class="btn s" href="#konsultasi" onclick="pre=${s.id}">Daftar sesi ini</a></div>`;
const marq=()=>{const h=D.testi.map(t=>`<div class="t"><div class="who">${t.img?`<img src="${esc(t.img)}" alt="">`:'<div class="av">🐶</div>'}<div><b>${esc(t.name)}</b><div class="mut">${esc(t.pet)}</div></div></div><p>“${esc(t.text)}”</p></div>`).join('');return `<div class="mq"><div class="track">${h+h}</div></div>`};
const gal=()=>D.gallery.length?`<div class="gal">${D.gallery.map(g=>`<img src="${esc(g.img)}" alt="${esc(g.cap)}" loading="lazy" onclick="zoom(this.src)">`).join('')}</div>`:'<p class="mut">Belum ada foto galeri.</p>';
const arts=n=>D.articles.slice(0,n||99).map(a=>`<article class="card" style="margin-bottom:14px">${a.img?`<img class="cv" src="${esc(a.img)}" alt="">`:''}<h3>${esc(a.title)}</h3><div class="mut">${esc(a.date)}</div><p>${esc(a.body).replace(/\n/g,'<br>')}</p></article>`).join('')||'<p class="mut">Belum ada artikel.</p>';
const faq=()=>D.faq.map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('');
const about=()=>`<div class="split"><div><h2>Tentang Kami</h2>${esc(D.cfg.about).split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div><img src="${esc(D.cfg.aboutImg||ABOUT)}" alt="Anjing dan kucing tidur berpelukan"></div>`;
const how=()=>`<div class="grid steps">${[['Daftar','Isi form konsultasi dan kirim foto hewan Anda.'],['Jadwal','Kami hubungi via WhatsApp untuk atur waktu sesi.'],['Sesi','Komunikasi dilakukan secara online atau tatap muka.'],['Hasil','Anda menerima rangkuman pesan dan saran perawatan.']].map(s=>`<div class="card"><b>${s[0]}</b><p class="mut">${s[1]}</p></div>`).join('')}</div>`;
let pre=0;
const V={
beranda:()=>`<div class="hero ${(D.cfg.heroImg||HERO)?'img':''}" ${(D.cfg.heroImg||HERO)?`style="background-image:linear-gradient(180deg,rgba(255,255,255,0) 35%,rgba(228,232,236,.6) 100%),url('${esc(D.cfg.heroImg||HERO)}')"`:''}><div class="hp"><span class="chip">🐾 Sejak ${esc(D.cfg.since)} · Jakarta</span><h1>${esc(D.cfg.tag)}</h1><p>${esc(D.cfg.hero)}</p><div class="row"><a class="btn" href="#konsultasi">Daftar Konsultasi</a><a class="btn o" target="_blank" rel="noopener" href="${waLink()}">Chat WhatsApp</a></div></div></div>
<section class="stats"><div class="card"><b>${new Date().getFullYear()-D.cfg.since}</b>Tahun pengalaman</div><div class="card"><b>${esc(D.cfg.happy)}</b>Pawrents terbantu</div><div class="card"><b>${esc(D.cfg.talks)}</b>Talkshow &amp; live</div></section>
<section><h2>Layanan</h2><div class="grid">${D.services.filter(s=>s.type=='layanan').map(card).join('')}</div></section>
<section>${about()}</section><section><h2>Cara Kerja</h2>${how()}</section>
<section><h2>Kata Mereka</h2>${marq()}</section><section><h2>Artikel Terbaru</h2>${arts(2)}</section><section><h2>Pertanyaan Umum</h2>${faq()}</section>`,
tentang:()=>about()+`<section><h2>Cara Kerja</h2>${how()}</section><section><h2>FAQ</h2>${faq()}</section>`,
layanan:()=>`<h2>Layanan</h2><div class="grid">${D.services.filter(s=>s.type=='layanan').map(card).join('')}</div>`,
pelatihan:()=>`<h2>Pelatihan</h2><div class="grid">${D.services.filter(s=>s.type=='pelatihan').map(card).join('')}</div>`,
testimoni:()=>`<h2>Testimoni</h2>${marq()}`,galeri:()=>`<h2>Galeri</h2>${gal()}`,artikel:()=>`<h2>Artikel</h2>${arts()}`,
kontak:()=>{const c=D.cfg,q=encodeURIComponent(c.addr);return `<h2>Kontak</h2><div class="split"><div class="card"><p>📍 ${esc(c.addr)}</p><p>🕒 ${esc(c.hours)}</p><p>📞 <a href="tel:+${esc(waNum(c.wa))}">+${esc(waNum(c.wa))}</a></p><p>✉️ <a href="mailto:${esc(c.email)}">${esc(c.email)}</a></p><p class="row">${c.ig?`<a target="_blank" rel="noopener" href="${esc(c.ig)}">📸 Instagram</a>`:''}${c.tiktok?`<a target="_blank" rel="noopener" href="${esc(c.tiktok)}">🎵 TikTok</a>`:''}</p><div class="row"><a class="btn" target="_blank" rel="noopener" href="${waLink()}">Chat WhatsApp</a><a class="btn o" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Buka Peta</a></div></div><iframe title="Peta" loading="lazy" style="width:100%;height:320px;border:0;border-radius:18px" src="https://maps.google.com/maps?q=${q}&output=embed"></iframe></div>`},
konsultasi:()=>{const s0=D.services.find(x=>x.id==pre)||D.services[0]||{};return `<h2>Form Konsultasi</h2><p class="mut">Isi data berikut, Anda akan diarahkan ke WhatsApp kami.</p><div class="split" style="align-items:start"><form class="fm" id="kf" onsubmit="return false">
<label>Nama pemilik</label><input id="k1" required><label>No. WhatsApp</label><input id="k2" type="tel" required><label>Alamat</label><input id="k3" required>
<label>Nama binatang</label><input id="k4" required><label>Layanan</label><select id="ks1" onchange="pkOpt()">${D.services.map(s=>`<option value="${s.id}" ${s.id==s0.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
<label>Paket</label><select id="ks2"></select><label>Foto binatang</label><input id="k5" type="file" accept="image/*"><label>Kasus / keluhan</label><textarea id="k6" required></textarea>
<p><button class="btn" id="kb">Kirim &amp; Lanjut ke WhatsApp</button></p><div id="kok"></div></form><aside class="card"><h3>Butuh bantuan cepat?</h3><p class="mut">🕒 ${esc(D.cfg.hours)}</p><p class="mut">Balasan biasanya kurang dari 1 jam pada jam operasional.</p><a class="btn" target="_blank" rel="noopener" href="${waLink()}">Chat WhatsApp</a></aside></div>`},
admin:()=>{if(!API)return `<h2>Admin</h2><p class="mut">Isi konstanta API di index.html dengan URL Web App Apps Script terlebih dahulu.</p>`;
if(!tok)return `<h2>Login Admin</h2><div class="fm"><label>Password</label><input id="pw" type="password"><p><button class="btn" onclick="login()">Masuk</button></p><div id="msg" class="mut"></div></div>`;
const T=[['leads','Pendaftar'],['services','Layanan & Harga'],['testi','Testimoni'],['articles','Artikel'],['gallery','Galeri'],['faq','FAQ'],['kontak','Kontak & Alamat'],['cfg','Tampilan & Info']];
return `<h2>Dashboard Admin</h2><div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';ed=null;draw()">${t[1]}</button>`).join('')}<button onclick="tok='';sessionStorage.removeItem('tk');draw()">Keluar</button></div><div id="msg" class="mut"></div>`+(tab=='leads'?LD():tab=='cfg'?CF():tab=='kontak'?KT():LS())}};

/* ---------- admin ---------- */
const SCH={services:[['type','Jenis','sel:layanan,pelatihan'],['icon','Ikon (emoji)'],['name','Nama'],['desc','Deskripsi','area'],['pk','Paket & harga (1 baris: Nama paket|Harga)','area'],['img','Foto (opsional)','img']],
testi:[['name','Nama'],['pet','Hewan'],['text','Testimoni','area'],['img','Foto','img']],articles:[['title','Judul'],['body','Isi','area'],['img','Foto sampul','img']],gallery:[['cap','Keterangan'],['img','Foto','img']],faq:[['q','Pertanyaan'],['a','Jawaban','area']],
kontak:[['wa','No. WhatsApp (format 628…)'],['email','Email'],['addr','Alamat lengkap (dipakai untuk peta)','area'],['hours','Jam buka'],['ig','Link Instagram'],['tiktok','Link TikTok (opsional)']],
cfg:[['brand','Nama brand'],['tag','Tagline'],['hero','Teks hero','area'],['about','Tentang kami (pisah paragraf dengan baris kosong)','area'],['since','Tahun berdiri'],['happy','Statistik: pawrents terbantu'],['talks','Statistik: talkshow'],['accent','Warna utama','color'],['font','Font','sel:Inter,Fraunces,Georgia,Verdana'],['heroImg','Foto latar hero','img'],['aboutImg','Foto tentang kami','img']]};
const FORM=(sch,o)=>sch.map(([k,l,t])=>`<label>${l}</label>`+(t=='area'?`<textarea id="f_${k}">${esc(o[k])}</textarea>`:t=='img'?`<input id="f_${k}" type="file" accept="image/*">${o[k]?`<img src="${esc(o[k])}" style="height:50px;border-radius:8px;margin-top:6px">`:''}`:(t||'').startsWith('sel')?`<select id="f_${k}">${t.slice(4).split(',').map(v=>`<option ${v==o[k]?'selected':''}>${v}</option>`).join('')}</select>`:`<input id="f_${k}" type="${t||'text'}" value="${esc(o[k]||(t=='color'?'#2f7d6b':''))}">`)).join('');
const msg=t=>{const m=$('#msg');if(m)m.textContent=t};
async function READ(sch,o){const n={...o};for(const[k,,t]of sch){const e=$('#f_'+k);if(t=='img'){if(e.files[0]){msg('Mengunggah foto…');const r=await api({a:'upload',token:tok,img:await pic(e.files[0],k=='heroImg'?1400:900)});if(!r.ok)throw new Error(r.err);n[k]=r.url}}else n[k]=e.value}return n}
async function commit(){msg('Menyimpan…');const r=await api({a:'save',token:tok,data:D});if(!r.ok){msg('Gagal: '+r.err);if(/Sesi/.test(r.err)){tok='';draw()}return false}return true}
const LS=()=>{const k=tab,sch=SCH[k],a=D[k],o=ed?(a.find(x=>x.id==ed.id)||{}):{};
return `<p><button class="btn s" onclick="ed={id:0};draw()">+ Tambah</button></p>`+(ed?`<div class="card fm"><h3>${ed.id?'Edit':'Tambah'}</h3>${FORM(sch,o)}<p class="row"><button class="btn" onclick="saveItem()">Simpan</button><button class="btn o" onclick="ed=null;draw()">Batal</button></p></div>`:'')+
(a.length?a.map(x=>`<div class="li"><div class="row" style="flex-wrap:nowrap">${x.img?`<img src="${esc(x.img)}" alt="">`:''}<div><b>${esc(x.name||x.title||x.cap||x.q||'(foto)')}</b><div class="mut">${esc((x.pk||x.text||x.pet||x.date||'').slice(0,60))}</div></div></div><div class="row"><button class="btn o s" onclick="ed={id:${x.id}};draw()">Edit</button><button class="btn r s" onclick="delItem(${x.id})">Hapus</button></div></div>`).join(''):'<p class="mut">Belum ada data.</p>')};
const CF=()=>`<div class="card fm"><h3>Tampilan & Info Situs</h3>${FORM(SCH.cfg,D.cfg)}<p><button class="btn" onclick="saveCfg('cfg')">Simpan</button></p></div>`;
const KT=()=>`<div class="card fm"><h3>Kontak & Alamat</h3><p class="mut">Tampil di halaman Kontak, footer, tombol WhatsApp, dan peta.</p>${FORM(SCH.kontak,D.cfg)}<p><button class="btn" onclick="saveCfg('kontak')">Simpan</button></p></div>`;
const LD=()=>`<button class="btn s" onclick="loadLeads()">Muat ulang</button>`+(leads.length?leads.map(r=>`<div class="li"><div class="row" style="flex-wrap:nowrap">${r[8]?`<img src="${esc(r[8])}">`:''}<div><b>${esc(r[1])}</b> · ${esc(r[4])}<div class="mut">${esc(r[5])} / ${esc(r[6])}<br>${esc(r[7])}</div></div></div><a class="btn s" target="_blank" rel="noopener" href="https://wa.me/${waNum(r[2])}">Hubungi</a></div>`).join(''):'<p class="mut">Belum ada data / klik Muat ulang.</p>');
async function loadLeads(){msg('Memuat…');const r=await api({a:'leads',token:tok});if(r.ok){leads=r.rows;draw()}else msg(r.err)}
async function saveItem(){try{const k=tab,a=D[k],o=await READ(SCH[k],ed.id?a.find(x=>x.id==ed.id):{});if(k=='articles'&&!o.date)o.date=new Date().toISOString().slice(0,10);if(ed.id)a[a.findIndex(x=>x.id==ed.id)]=o;else{o.id=nid(a);k=='articles'?a.unshift(o):a.push(o)}if(await commit()){ed=null;draw()}}catch(e){msg('Gagal: '+e.message)}}
async function delItem(id){if(!confirm('Hapus item ini?'))return;D[tab]=D[tab].filter(x=>x.id!=id);if(await commit())draw()}
async function saveCfg(k){try{D.cfg=await READ(SCH[k],D.cfg);if(await commit())draw()}catch(e){msg('Gagal: '+e.message)}}
async function login(){msg('Masuk…');const r=await api({a:'login',pass:$('#pw').value});if(r.ok){tok=r.token;sessionStorage.setItem('tk',tok);draw()}else msg(r.err)}

/* ---------- form konsultasi ---------- */
function pkOpt(){const s=D.services.find(x=>x.id==$('#ks1').value);$('#ks2').innerHTML=String(s?.pk||'').split('\n').filter(Boolean).map(l=>`<option>${esc(l.replace('|',' — '))}</option>`).join('')||'<option>-</option>'}
async function sendLead(){const f=$('#kf');if(!f.reportValidity())return;const g=i=>$('#'+i).value.trim(),b=$('#kb');b.disabled=true;b.textContent='Mengirim…';
const l={a:'lead',owner:g('k1'),wa:g('k2'),addr:g('k3'),pet:g('k4'),svc:$('#ks1').selectedOptions[0].text,pkg:g('ks2'),cs:g('k6'),img:await pic($('#k5').files[0],700)};
if(API)try{await api(l)}catch(e){}
const t=`Halo, saya ingin konsultasi.\nNama pemilik: ${l.owner}\nNo. WA: ${l.wa}\nAlamat: ${l.addr}\nNama binatang: ${l.pet}\nLayanan: ${l.svc}\nPaket: ${l.pkg}\nKasus: ${l.cs}\n(Foto saya kirim di chat ini)`;
$('#kok').innerHTML=`<div class="ok">Terima kasih, ${esc(l.owner)}! Data terkirim. Jika WhatsApp tidak terbuka, <a target="_blank" rel="noopener" href="${waLink(t)}">klik di sini</a>.</div>`;f.reset();b.disabled=false;b.textContent='Kirim & Lanjut ke WhatsApp';window.open(waLink(t),'_blank')}
const zoom=s=>{const l=$('#lb');l.querySelector('img').src=s;l.style.display='grid'};

/* ---------- render ---------- */

let rvView='',rvIO;
function reveal(){if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
if(rvIO)rvIO.disconnect();const cnt=new Map();
rvIO=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target;rvIO.unobserve(el);el.classList.add('in');setTimeout(()=>el.classList.remove('rv','in'),1100+parseFloat(el.style.getPropertyValue('--d')||0)*1000)}),{threshold:.1,rootMargin:'0px 0px -6% 0px'});
document.querySelectorAll('#app>h2,#app section>h2,#app .grid>*,#app .split>*,#app .stats>*,#app .mq,#app details,#app article,#app .gal img,#app>p').forEach(el=>{const k=el.parentNode,n=cnt.get(k)||0;cnt.set(k,n+1);el.style.setProperty('--d',Math.min(n,5)*.09+'s');el.classList.add('rv');rvIO.observe(el)})}
function draw(){let v=location.hash.slice(1)||'beranda';if(!V[v])v='beranda';const c=D.cfg;
document.documentElement.style.setProperty('--accent',c.accent);document.documentElement.style.setProperty('--bf',`"${c.font}",system-ui,sans-serif`);document.title=c.brand+' – '+c.tag;
$('#top').textContent='🕒 '+c.hours;$('#brand').textContent='🐾 '+c.brand;$('#fab').href=waLink();
$('#links').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==v?'on':''}">${n[1]}</a>`).join('');
$('#foot').innerHTML=`<div><b>${esc(c.brand)}</b><p class="mut">${esc(c.tag)}</p></div><div><b>Kontak</b><p class="mut">${esc(c.addr)}<br>${esc(c.email)}<br>+${esc(waNum(c.wa))}</p></div><div><b>Ikuti kami</b><p><a target="_blank" rel="noopener" href="${esc(c.ig)}">Instagram</a> · <a target="_blank" rel="noopener" href="${waLink()}">WhatsApp</a> · <a href="#admin">Admin</a></p><p class="mut">© ${new Date().getFullYear()} ${esc(c.brand)}</p></div>`;
$('#mm').innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==v?'on':''}">${n[1]}</a>`).join('')+'<a class="btn" href="#konsultasi">Daftar Konsultasi</a>';$('#mm').classList.remove('open');$('#mb').onclick=()=>$('#mm').classList.toggle('open');
$('#app').innerHTML=V[v]();if(v=='konsultasi'){pkOpt();$('#kb').onclick=sendLead}if(v!='admin'&&v!==rvView)reveal();rvView=v}
const fabv=()=>$('#fab').classList.toggle('show',scrollY>320||(location.hash!==''&&location.hash!=='#beranda'));
addEventListener('scroll',fabv,{passive:true});addEventListener('hashchange',()=>{draw();scrollTo(0,0);fabv()});draw();fabv();
if(API)fetch(API).then(r=>r.json()).then(r=>{if(r.ok&&r.data){for(const k in r.data)if(r.data[k]!=null)D[k]=k=='cfg'?{...DEF.cfg,...r.data.cfg}:r.data[k];draw()}}).catch(()=>{});

/* jejak kaki kucing berjalan-jalan */
(()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='12' cy='28' rx='6' ry='8'/><ellipse cx='26' cy='15' rx='6' ry='8'/><ellipse cx='42' cy='15' rx='6' ry='8'/><ellipse cx='54' cy='28' rx='6' ry='8'/><path d='M32 32c-10 0-18 9-18 17 0 6 5 8 11 7 5-1 7-2 7-2s2 1 7 2c6 1 11-1 11-7 0-8-8-17-18-17z'/></svg>";
document.documentElement.style.setProperty('--paw','url("data:image/svg+xml,'+encodeURIComponent(svg)+'")');
const L=document.createElement('div');L.id='paws';document.body.appendChild(L);
let x=-30,y=innerHeight*.65,a=-.15,side=1;
function paw(px,py,r){const e=document.createElement('span');e.style.cssText=`left:${px}px;top:${py}px;transform:rotate(${r}rad)`;L.appendChild(e);setTimeout(()=>e.remove(),4600)}
setInterval(()=>{if(document.hidden)return;a+=(Math.random()-.5)*.6;x+=Math.cos(a)*40;y+=Math.sin(a)*40;
if(x>innerWidth+40||x<-60||y<30||y>innerHeight-30)a=Math.atan2(innerHeight*(.25+Math.random()*.5)-y,innerWidth*(.25+Math.random()*.5)-x);
paw(x-Math.sin(a)*11*side,y+Math.cos(a)*11*side,a+Math.PI/2);side*=-1},450);
})();
</script>
</body>
</html>
